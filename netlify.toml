[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Customer portal: readable private links like /account/wildfactory/ABCD-EFGH all serve account.html,
# which reads the company + code from the address bar (see share/netlify/functions/_accounts.mjs).
[[redirects]]
  from = "/account/*"
  to = "/account.html"
  status = 200
